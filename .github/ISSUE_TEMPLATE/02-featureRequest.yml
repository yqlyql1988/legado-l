name: 功能请求 / Feature Request
description: 建议可以解决明确使用场景的新功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这里记录阅读L的个人开发需求。请说明实际使用场景、期望结果，以及需要保留的已有功能。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，没有相同或相关的请求
          required: true
        - label: "[阅读L已发布版本](https://github.com/yqlyql1988/reading-l/releases)尚未提供此功能"
          required: true
        - label: 我已说明具体使用场景和需要保留的已有功能
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - Android
        - Web
        - Android 与 Web
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 阅读文本与翻页
        - 漫画阅读
        - 朗读与音频
        - 书架与书籍管理
        - 书源与规则解析
        - Web 服务与前端
        - 备份、同步与数据
        - 构建、安装与更新
        - 其他或不确定
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 要解决的问题
      description: 说明当前遇到的限制，以及期望改善的操作。
    validations:
      required: true

  - type: textarea
    id: beneficiaries
    attributes:
      label: 受益用户与使用场景
      description: 说明哪些用户群体会受益、使用频率和可复用的实际场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的操作流程和结果，无需提供具体代码实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有功能与替代方案
      description: 说明现有功能是否能够解决问题、已经尝试过的替代方式，以及可以接受的简化方案。
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 相关 Issue 与查重结果
      description: 列出搜索关键词、相关 Issue 或讨论链接；如没有相关内容，请说明搜索范围。
    validations:
      required: true

  - type: textarea
    id: project_fit
    attributes:
      label: 兼容性与保留要求
      description: 说明需要保留的阅读L功能、设备兼容性或精简配置要求。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 阅读L版本
      placeholder: 3.26.080404

  - type: textarea
    id: demo
    attributes:
      label: 补充材料
      placeholder: 可拖入草图、截图或可借鉴的产品链接。
